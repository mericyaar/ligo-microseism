[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ligo-microseism"
version = "0.1.0"
description = "Causal linear and non-linear microseismic noise subtraction for LIGO optical cavities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Meric Yasar"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "lightning>=2.1"]
dev = ["pytest>=7.4", "nbstripout", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
